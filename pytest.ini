[pytest]
# Run from the repo root:  python -m pytest
testpaths = tests
# Lets tests `import backend.…` without installing the package.
pythonpath = .
# jade.py uses the deprecated numpy.matrix class (known issue — see
# docs/KNOWN_ISSUES.md); hide that one warning so real ones stand out.
filterwarnings =
    ignore:the matrix subclass is not the recommended way:PendingDeprecationWarning
